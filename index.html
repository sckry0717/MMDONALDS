<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美味線上點餐系統 (模擬)</title>
    <style>
        :root {
            --primary-color: #e67e22;
            --secondary-color: #2c3e50;
            --bg-color: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }

        header {
            text-align: center;
            padding: 20px 0;
            background-color: var(--secondary-color);
            color: white;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        /* 商品列表 */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .menu-item {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
        }

        .menu-item:hover {
            transform: translateY(-5px);
        }

        .menu-item img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }

        .item-info {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .item-name {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .item-price {
            color: var(--primary-color);
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .qty-input {
            width: 50px;
            padding: 5px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .btn-add {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            flex-grow: 1;
        }

        .btn-add:hover {
            background-color: #d35400;
        }

        /* 購物車 */
        .cart-panel {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .cart-title {
            font-size: 1.4rem;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-top: 0;
        }

        .cart-items {
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .btn-remove {
            background: none;
            border: none;
            color: #ff4d4d;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .total-section {
            font-size: 1.3rem;
            font-weight: bold;
            text-align: right;
            margin-bottom: 20px;
        }

        .btn-pay {
            width: 100%;
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-pay:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

<header>
    <h1>模擬點餐系統</h1>
    <p>請選擇您想吃的餐點</p>
</header>

<div class="container">
    <div class="menu-grid" id="menu">
        </div>

    <div class="cart-panel">
        <h3 class="cart-title">您的訂單</h3>
        <div class="cart-items" id="cart-items">
            <p style="color: #888; text-align: center;">購物車還是空的</p>
        </div>
        <div class="total-section">
            總計: $<span id="total-price">0</span>
        </div>
        <button class="btn-pay" onclick="handlePayment()">確認支付</button>
    </div>
</div>

<script>
    // 商品資料（已更新水與熱狗堡的圖片連結）
    const products = [
        { id: 1, name: '果汁', price: 30, img: 'https://images.unsplash.com/photo-1621506289937-a8e4df240d0b?auto=format&fit=crop&w=400&q=80' },
        { id: 2, name: '牛奶', price: 40, img: 'https://images.unsplash.com/photo-1550583724-b2692b85b150?auto=format&fit=crop&w=400&q=80' },
        { id: 3, name: '漢堡', price: 60, img: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=400&q=80' },
        { id: 4, name: '水', price: 10, img: 'https://images.unsplash.com/photo-1548839140-29a749e1cf4d?auto=format&fit=crop&w=400&q=80' },
        { id: 5, name: '熱狗堡', price: 50, img: 'https://images.unsplash.com/photo-1619740455993-9e612b1af08a?auto=format&fit=crop&w=400&q=80' },
        { id: 6, name: '冰淇淋', price: 45, img: 'https://images.unsplash.com/photo-1501443762994-82bd5dace89a?auto=format&fit=crop&w=400&q=80' }
    ];

    let cart = [];

    // 初始化商品列表
    function renderMenu() {
        const menuEl = document.getElementById('menu');
        menuEl.innerHTML = products.map(p => `
            <div class="menu-item">
                <img src="${p.img}" alt="${p.name}">
                <div class="item-info">
                    <div>
                        <div class="item-name">${p.name}</div>
                        <div class="item-price">$${p.price}</div>
                    </div>
                    <div class="controls">
                        <input type="number" id="qty-${p.id}" class="qty-input" value="1" min="1" max="20">
                        <button class="btn-add" onclick="addToCart(${p.id})">加入點餐</button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    // 加入購物車
    function addToCart(id) {
        const product = products.find(p => p.id === id);
        const qtyInput = document.getElementById(`qty-${id}`);
        const quantity = parseInt(qtyInput.value);

        if (quantity <= 0) return;

        const existingItem = cart.find(item => item.id === id);
        if (existingItem) {
            existingItem.quantity += quantity;
        } else {
            cart.push({ ...product, quantity });
        }

        qtyInput.value = 1;
        renderCart();
    }

    // 從購物車刪除
    function removeFromCart(id) {
        cart = cart.filter(item => item.id !== id);
        renderCart();
    }

    // 渲染購物車
    function renderCart() {
        const cartItemsEl = document.getElementById('cart-items');
        const totalPriceEl = document.getElementById('total-price');
        
        if (cart.length === 0) {
            cartItemsEl.innerHTML = '<p style="color: #888; text-align: center;">購物車還是空的</p>';
            totalPriceEl.innerText = '0';
            return;
        }

        let total = 0;
        cartItemsEl.innerHTML = cart.map(item => {
            const itemTotal = item.price * item.quantity;
            total += itemTotal;
            return `
                <div class="cart-item">
                    <div>
                        <strong>${item.name}</strong> x ${item.quantity}
                        <br><span style="color:#888; font-size:0.85rem;">單價: $${item.price}</span>
                    </div>
                    <div style="text-align: right;">
                        <div>$${itemTotal}</div>
                        <button class="btn-remove" onclick="removeFromCart(${item.id})">移除</button>
                    </div>
                </div>
            `;
        }).join('');

        totalPriceEl.innerText = total;
    }

    // 模擬支付功能
    function handlePayment() {
        if (cart.length === 0) {
            alert('您的購物車是空的，請先點餐唷！');
            return;
        }
        const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        const confirmPay = confirm(`訂單總計 $${total} 元。\n是否確認模擬支付？`);
        if (confirmPay) {
            alert('🎉 支付成功！感謝您的訂購！（本系統為模擬環境，未收取任何費用）');
            cart = [];
            renderCart();
        }
    }

    renderMenu();
</script>

</body>
</html>
